name = "carematch"
compatibility_date = "2026-07-24"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "getcompanioncare.com", custom_domain = true },
  { pattern = "www.getcompanioncare.com", custom_domain = true },
]

# The hourly Cron Trigger (see scheduledTasks in vite.config.ts) runs
# unattended, so without retained logs its only failure signal is a user
# noticing a missing reminder. `wrangler tail` shows live traffic only, which is
# no help for something that fires once an hour.
[observability]
enabled = true

# `main` and `[assets]` are intentionally omitted — Nitro's cloudflare-module
# preset always regenerates these with paths correct relative to
# .output/server at build time (see .output/server/wrangler.json after
# `npm run build`); anything set here for those two is silently overridden.

# Non-secret config. Real secrets (SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY,
# STRIPE_SECRET_KEY, etc.) are set via `wrangler secret put <NAME>` instead —
# never put them here, this file is committed to git.
[vars]
# Pre-launch gate (src/lib/coming-soon-gate.ts). "1" redirects every public
# marketing route to /coming-soon and serves a full Disallow to crawlers; set to
# "0" or delete the line to open the site. The preview token that lets the team
# see the real site is a secret: `wrangler secret put COMING_SOON_TOKEN`.
COMING_SOON = "1"
# Where new waitlist signups get emailed. Optional — the row is stored either
# way, this just saves someone having to poll Supabase.
WAITLIST_NOTIFY_ADDRESS = "hello@getcompanioncare.com"
SUPABASE_URL = "https://wcjahuathjuzocvpmewu.supabase.co"
SUPABASE_PROJECT_ID = "wcjahuathjuzocvpmewu"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_zZKtE4bhhKEjSAardvcmwQ_5skfgwt0"
VITE_SUPABASE_URL = "https://wcjahuathjuzocvpmewu.supabase.co"
VITE_SUPABASE_PROJECT_ID = "wcjahuathjuzocvpmewu"
VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_zZKtE4bhhKEjSAardvcmwQ_5skfgwt0"
BACKGROUND_CHECK_VENDOR = "manual"
IDV_VENDOR = "manual"
EMAIL_PROVIDER = "resend"
EMAIL_FROM_ADDRESS = "support@getcompanioncare.com"
STRIPE_PUBLISHABLE_KEY = "pk_test_51TyJcP2fJfCL5U9kSJ7l3W8PZagFOKiGgao6yvE1AHOqP2HFpnZTdFzCLj8FPgURbnKX0MoiYKWpsiLzTq2Zhtq7000M5zDUuH"
PLATFORM_FEE_BPS = "1500"
